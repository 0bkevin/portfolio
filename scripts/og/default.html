<!doctype html>
<!--
  Source for public/assets/kevin-bravo-og.png (1200×630). Render it with `npm run og`.
  Uses the homepage's tokens: #0a0a0a surface, #facc15 accent, Inter for the name, Geist Mono for labels.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono Variable";
        src: url("../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: "Inter Variable", sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 72px 88px 64px;
        display: flex;
        flex-direction: column;
      }

      .mono { font-family: "Geist Mono Variable", monospace; }

      /* Top row: the navbar wordmark and the domain. */
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 22px;
      }
      .wordmark { color: #e5e5e5; }
      .wordmark .aka { opacity: 0.6; margin: 0 0.3em; }
      .aka-tag {
        font-size: 20px;
        padding: 0 0.35em;
        background: rgba(229, 229, 229, 0.08);
        box-shadow: 3px 3px 0 #facc15;
      }
      .domain { color: #858585; }

      /* Hero: same hierarchy as the homepage. */
      .hero { margin-top: auto; margin-bottom: auto; }
      h1 {
        font-size: 156px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #facc15;
        margin-left: -6px;
      }
      .role { margin-top: 30px; font-size: 30px; }
      .role .primary { color: #e5e5e5; }
      .role .secondary { color: #858585; }

      /* Bottom row: a section-heading rule with what Kevin works on. */
      .bottom {
        display: flex;
        align-items: center;
        gap: 24px;
        font-size: 20px;
        color: #858585;
      }
      .bottom .num { color: #facc15; }
      .bottom .rule { flex: 1; height: 1px; background: #262626; }
    </style>
  </head>
  <body>
    <div class="top mono">
      <span class="wordmark">kevin bravo<span class="aka">aka</span><span class="aka-tag">0bkevin</span></span>
      <span class="domain">kevinbravo.com</span>
    </div>

    <div class="hero">
      <h1>Kevin Bravo</h1>
      <p class="role mono">
        <span class="primary">product &amp; ai engineer</span><span class="secondary"> · full-stack</span>
      </p>
    </div>

    <div class="bottom mono">
      <span><span class="num">//</span> ai agents · rag &amp; evals · mcp</span>
      <span class="rule"></span>
      <span>caracas, ve</span>
    </div>
  </body>
</html>
